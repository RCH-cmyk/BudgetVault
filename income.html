<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Security: scripts only from this site + the Chart.js CDN; no plugins, no <base> tricks, no form posts -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- Asks search engines not to list this friends-only tool (delete this line if you want it searchable) -->
  <meta name="robots" content="noindex">
  <!-- Colours the browser bar on phones -->
  <meta name="theme-color" content="#1B2A4A">
  <title>Income - Budget Vault</title>
  <!-- Emoji favicon built inline, so there is no extra file and no 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💷%3C/text%3E%3C/svg%3E">
  <!-- Shared styles (file sits next to this page) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation bar (same on every page) -->
  <header class="topbar">
    <span class="brand">Budget Vault</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="income.html" class="active">Income</a>
      <a href="budget.html">Budget</a>
    </nav>
  </header>

  <main class="container">
    <!-- Only shown if JavaScript is switched off -->
    <noscript><p class="panel warn">Budget Vault needs JavaScript switched on to work.</p></noscript>

    <h1>Income calculator</h1>
    <p class="subtitle">Enter what you take home after tax. Results update as you type and save automatically.</p>

    <div class="panel">
      <!-- Pick whether you know your weekly or your monthly pay -->
      <div class="toggle">
        <button type="button" id="modeWeekly" class="active">Per week</button>
        <button type="button" id="modeMonthly">Per month</button>
      </div>

      <!-- One box for the amount (its label and placeholder change with the toggle) -->
      <div class="field-row">
        <div>
          <label for="amount" id="amountLabel">Take-home pay per week, after tax (£)</label>
          <input type="number" id="amount" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 450">
          <!-- Explains the sum being done (text changes with the toggle) -->
          <p class="muted" id="howItWorks"></p>
        </div>
      </div>
    </div>

    <!-- Results (filled in by income.js) -->
    <div class="stat-grid">
      <div class="stat"><div class="label">Weekly (after tax)</div><div class="value" id="outWeekly">£0.00</div></div>
      <div class="stat highlight"><div class="label">Monthly (used in your budget)</div><div class="value good" id="outMonthly">£0.00</div></div>
      <div class="stat"><div class="label">Yearly (after tax)</div><div class="value" id="outYearly">£0.00</div></div>
    </div>

    <!-- "Saved" message (role=status lets screen readers announce it politely) -->
    <p class="muted" id="savedMsg" role="status" aria-live="polite">&nbsp;</p>
    <a class="btn" href="budget.html">Go to my budget &rarr;</a>
  </main>

  <script src="storage.js"></script>
  <script src="income.js"></script>
</body>
</html>
